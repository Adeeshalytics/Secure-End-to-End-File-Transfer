services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secure_academic_eval}
      POSTGRES_USER: ${POSTGRES_USER:-secure_eval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secure_eval} -d ${POSTGRES_DB:-secure_academic_eval}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

